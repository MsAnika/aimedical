services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meddiag
      POSTGRES_PASSWORD: meddiag
      POSTGRES_DB: meddiag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://meddiag:meddiag@db:5432/meddiag
      SECRET_KEY: docker-secret-change-me
    volumes:
      - ./media:/app/media
    depends_on:
      - db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"